<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reward Shop — LearnQuest</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <a class="brand" href="dashboard.html"><span class="leaf-badge">🌿</span><span data-i18n="app_name">LearnQuest</span></a>
      <div id="coinPill" class="stat-pill coins">🪙 0</div>
    </header>

    <main class="container mt-24" style="flex:1; padding-bottom: 60px;">
      <h2 data-i18n="rewards_title">Reward Shop</h2>
      <p class="muted" data-i18n="rewards_subtitle">Spend your coins on jungle gear!</p>
      <div class="reward-grid" id="rewardGrid"></div>
    </main>
  </div>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script>
  requireChildAuth();
  let state = null;

  function render() {
    document.getElementById("coinPill").textContent = `🪙 ${state.coins}`;
    const grid = document.getElementById("rewardGrid");
    grid.innerHTML = "";
    state.rewards.forEach((r) => {
      const card = document.createElement("div");
      card.className = "card-flat reward-card";
      card.innerHTML = `
        <div class="emoji">${r.emoji}</div>
        <div style="font-weight:700;">${r.name}</div>
        <div class="cost">${r.cost_coins > 0 ? "🪙 " + r.cost_coins : "—"}</div>
        <button class="btn btn-sm ${r.owned ? "btn-ghost" : "btn-primary"} btn-block" ${r.owned ? "disabled" : ""} data-id="${r.id}" data-cost="${r.cost_coins}">
          ${r.owned ? t("rewards_owned") : t("rewards_unlock")}
        </button>
      `;
      const btn = card.querySelector("button");
      if (!r.owned) {
        btn.onclick = async () => {
          try {
            await api.rewardUnlock(r.id);
            await load();
          } catch (e) {
            showToast(t("rewards_not_enough"));
          }
        };
      }
      grid.appendChild(card);
    });
  }

  async function load() {
    state = await api.rewards();
    render();
  }

  document.addEventListener("lq:i18n-ready", () => { if (state) render(); else load(); });
</script>
</body>
</html>
