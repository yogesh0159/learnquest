<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Tasks — LearnQuest</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
  <div class="screen">
    <header class="topbar">
      <a class="brand" href="dashboard.html"><span class="leaf-badge">🌿</span><span data-i18n="app_name">LearnQuest</span></a>
    </header>

    <main class="container mt-24" style="flex:1; max-width:640px; padding-bottom: 60px;">
      <h2 data-i18n="tasks_title">My Tasks</h2>
      <div id="taskList"></div>
      <p id="emptyMsg" class="muted hidden" data-i18n="tasks_empty">No tasks yet — check back soon!</p>
    </main>
  </div>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script>
  requireChildAuth();
  let tasks = [];

  function render() {
    const list = document.getElementById("taskList");
    list.innerHTML = "";
    if (tasks.length === 0) {
      document.getElementById("emptyMsg").classList.remove("hidden");
      return;
    }
    document.getElementById("emptyMsg").classList.add("hidden");
    tasks.forEach((task) => {
      const row = document.createElement("div");
      row.className = "card-flat mt-24";
      const rewardLabel = task.reward_type === "coins"
        ? `🪙 +${task.reward_value}`
        : `⏱️ +${task.reward_value} min Adventure Mode`;
      row.innerHTML = `
        <div class="flex-between">
          <div>
            <div style="font-weight:700; font-family:var(--font-display);">${task.title}</div>
            <div class="muted" style="font-size:0.9rem;">${task.description || ""}</div>
            <div style="margin-top:6px; font-weight:700; color:var(--sunbeam-deep);">${rewardLabel}</div>
          </div>
          <div>
            ${task.status === "completed"
              ? `<span class="badge" style="background:var(--leaf-light); padding:6px 14px; border-radius:999px; font-weight:700;">${t("tasks_completed")}</span>`
              : `<button class="btn btn-primary btn-sm" data-id="${task.id}">${t("tasks_complete")}</button>`}
          </div>
        </div>
      `;
      if (task.status !== "completed") {
        row.querySelector("button").onclick = async (e) => {
          await api.completeTask(task.id);
          showToast("🎉 +" + task.reward_value + (task.reward_type === "coins" ? " coins!" : " minutes!"));
          load();
        };
      }
      list.appendChild(row);
    });
  }

  async function load() {
    const res = await api.myTasks();
    tasks = res.tasks;
    render();
  }

  document.addEventListener("lq:i18n-ready", () => { if (tasks.length || document.readyState) load(); });
  load();
</script>
</body>
</html>
